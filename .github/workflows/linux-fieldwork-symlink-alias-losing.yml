name: Linux Fieldwork symlink alias losing test

on:
  push:
    branches:
      - ci/biome-11110-symlink-alias-losing-test
    paths:
      - crates/biome_service/src/scanner/watcher.tests.rs
      - .github/workflows/linux-fieldwork-symlink-alias-losing.yml
  pull_request:
    paths:
      - crates/biome_service/src/scanner/watcher.tests.rs
      - .github/workflows/linux-fieldwork-symlink-alias-losing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biome-11110-symlink-alias-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  losing-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout controlled losing test
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3
        with:
          cache-base: biome-11110-symlink-alias
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run stable-feature symlink alias discriminator
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt --all --check
          cargo test -p biome_service --features stable \
            should_map_ignored_symlink_alias_to_real_workspace_path -- --exact --nocapture
