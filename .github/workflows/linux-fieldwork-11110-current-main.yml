name: Linux Fieldwork 11110 current-main candidate

on:
  push:
    branches:
      - fieldwork/11110-current-main-git-internal
    paths:
      - .github/fieldwork/11110-current-main/**
      - .github/workflows/linux-fieldwork-11110-current-main.yml
  pull_request:
    paths:
      - .github/fieldwork/11110-current-main/**
      - .github/workflows/linux-fieldwork-11110-current-main.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biome-11110-current-main-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_MAIN: 4a0bc5c46e6dbbefd17fa133ea426aa41f0a23f8
  WATCHER_BLOB: d0a8f433234ef87c1db841fd7b390b13754432f4
  TEST_BLOB: 801a98a06cc07c3bc109fbdee3698b527619892c
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  INSTA_UPDATE: no

jobs:
  current-main-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out controlled carrier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
          path: carrier

      - name: Check out exact public main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: biomejs/biome
          ref: ${{ env.PUBLIC_MAIN }}
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Verify identity and apply candidate
        run: |
          set -euo pipefail
          mkdir -p artifacts/current-main
          test "$(git -C source rev-parse HEAD)" = "$PUBLIC_MAIN"
          test "$(git -C source hash-object crates/biome_service/src/scanner/watcher.rs)" = "$WATCHER_BLOB"
          test "$(git -C source hash-object crates/biome_service/src/scanner/watcher.tests.rs)" = "$TEST_BLOB"
          (
            cd source
            python3 ../carrier/.github/fieldwork/11110-current-main/apply_git_internal_candidate.py
          )
          printf '%s\n' \
            crates/biome_service/src/scanner/watcher.rs \
            crates/biome_service/src/scanner/watcher.tests.rs \
            | sort >expected-files.txt
          git -C source diff --name-only | sort >changed-files.txt
          diff -u expected-files.txt changed-files.txt

      - name: Install Rust toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3
        with:
          cache-base: biome-11110-current-main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize formatted source and run focused gate
        working-directory: source
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          git diff --name-only | sort >../formatted-files.txt
          diff -u ../expected-files.txt ../formatted-files.txt
          git diff -- \
            crates/biome_service/src/scanner/watcher.rs \
            crates/biome_service/src/scanner/watcher.tests.rs \
            >../artifacts/current-main/candidate.patch
          cargo test -p biome_service --features stable \
            should_ignore_git_internal_events -- --exact --nocapture

      - name: Verify bounded candidate diff
        if: always()
        run: |
          set -euo pipefail
          if test -d source/.git; then
            git -C source diff --check
            git -C source diff --name-only | sort >final-files.txt
            if test -f expected-files.txt; then
              diff -u expected-files.txt final-files.txt
            fi
          fi
          test -z "$(git -C carrier status --short --untracked-files=no)"

      - name: Upload exact candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biome-11110-current-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/current-main/
          if-no-files-found: warn
          retention-days: 30
